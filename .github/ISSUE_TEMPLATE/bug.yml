name: Lỗi
description: Hành vi sai so với yêu cầu
type: Bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options:
        - 'area:admin'
        - 'area:ai-chat'
        - 'area:config'
        - 'area:contracts'
        - 'area:docs'
        - 'area:game'
        - 'area:game-assets'
        - 'area:game-shared'
        - 'area:identity'
        - 'area:infra'
        - 'area:media'
        - 'area:nest-kit'
        - 'area:notification'
        - 'area:payment'
        - 'area:shop'
        - 'area:ui'
        - 'area:web-3d'
        - 'area:worker-ai'
        - 'area:worker-asset'
        - 'area:worker-jobs'
        - 'area:world'
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - 'M0 · Nền móng'
        - 'M1 · Giao diện và Identity'
        - 'M2 · Lát cắt đầu'
        - 'M3 · Xèng và Payment'
        - 'M4 · Chủ tiệm'
        - 'M5 · Tích hợp game core'
        - 'M6 · Bot học tăng cường'
        - 'M7 · Chatbot, TTS và NPC'
        - 'M8 · Production'
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 'Urgent'
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Chọn Area, Milestone, Priority và Effort trong biểu mẫu; workflow sẽ đồng bộ chúng vào thanh bên. Khi nhận việc, điền Assignees, Start date, Target date. Xem CONTRIBUTING.md.
  - type: input
    id: requirement
    attributes:
      label: Yêu cầu bị vi phạm
      description: Mã REQ nếu xác định được.
      placeholder: REQ-000
  - type: dropdown
    id: environment
    attributes:
      label: Môi trường
      options:
        - Local
        - Staging
        - Production
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản
      placeholder: identity/stg-v0.1.0
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh và các bước tái hiện
      description: Đang làm gì thì gặp lỗi, làm lại theo từng bước thế nào.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Mong đợi và thực tế
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Xong khi nào
      description: Hành vi đúng sau khi sửa và cách kiểm lại.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bằng chứng
      description: Log, ảnh chụp. Che secret và dữ liệu cá nhân trước khi dán.
