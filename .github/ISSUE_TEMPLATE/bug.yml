name: Lỗi
description: Hành vi sai so với yêu cầu
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Sau khi tạo, điền thanh bên phải: Labels `area:*`, Milestone, Priority, Effort. Khi nhận việc, điền thêm Assignees, Start date, Target date. Xem CONTRIBUTING.md.
  - type: input
    id: requirement
    attributes:
      label: Yêu cầu bị vi phạm
      description: Mã REQ nếu xác định được.
      placeholder: REQ-000
  - type: dropdown
    id: environment
    attributes:
      label: Môi trường
      options:
        - Local
        - Staging
        - Production
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phiên bản
      placeholder: identity/stg-v0.1.0
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh và các bước tái hiện
      description: Đang làm gì thì gặp lỗi, làm lại theo từng bước thế nào.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Mong đợi và thực tế
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Xong khi nào
      description: Hành vi đúng sau khi sửa và cách kiểm lại.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bằng chứng
      description: Log, ảnh chụp. Che secret và dữ liệu cá nhân trước khi dán.
