name: Tính năng
description: Một khả năng mới cho người dùng, thường là issue cha có các issue con
type: Feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options:
        - 'area:admin'
        - 'area:ai-chat'
        - 'area:config'
        - 'area:contracts'
        - 'area:docs'
        - 'area:game'
        - 'area:game-assets'
        - 'area:game-shared'
        - 'area:identity'
        - 'area:infra'
        - 'area:media'
        - 'area:nest-kit'
        - 'area:notification'
        - 'area:payment'
        - 'area:shop'
        - 'area:ui'
        - 'area:web-3d'
        - 'area:worker-ai'
        - 'area:worker-asset'
        - 'area:worker-jobs'
        - 'area:world'
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - 'M0 · Nền móng'
        - 'M1 · Giao diện và Identity'
        - 'M2 · Lát cắt đầu'
        - 'M3 · Xèng và Payment'
        - 'M4 · Chủ tiệm'
        - 'M5 · Tích hợp game core'
        - 'M6 · Bot học tăng cường'
        - 'M7 · Chatbot, TTS và NPC'
        - 'M8 · Production'
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 'Urgent'
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Chọn Area, Milestone và Priority trong biểu mẫu; workflow sẽ đồng bộ chúng vào thanh bên. Khi nhận việc, điền Assignees, Start date, Target date. Effort không bắt buộc. Xem CONTRIBUTING.md.
  - type: input
    id: requirement
    attributes:
      label: Yêu cầu
      description: Mã trong sổ yêu cầu, ví dụ REQ-009. Chưa có thì thêm vào sổ trước.
      placeholder: REQ-000
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh
      description: Người dùng đang thiếu gì hoặc gặp khó gì.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Kết quả người dùng nhận được
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Xong khi nào
      description: Tiêu chí nghiệm thu, mỗi dòng là một điều kiểm được.
      placeholder: |
        - [ ] Chủ tiệm chọn được khu đất còn trống
        - [ ] Khu đất đã có người thuê không chọn được
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Ghi chú
      description: Phụ thuộc, câu hỏi còn mở, phần ngoài phạm vi.
