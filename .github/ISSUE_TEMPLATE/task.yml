name: Công việc
description: Một việc làm được trong vài ngày, kết thúc bằng một PR
type: Task
body:
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options:
        - 'area:admin'
        - 'area:ai-chat'
        - 'area:config'
        - 'area:contracts'
        - 'area:docs'
        - 'area:game'
        - 'area:game-assets'
        - 'area:game-shared'
        - 'area:identity'
        - 'area:infra'
        - 'area:media'
        - 'area:nest-kit'
        - 'area:notification'
        - 'area:payment'
        - 'area:shop'
        - 'area:ui'
        - 'area:web-3d'
        - 'area:worker-ai'
        - 'area:worker-asset'
        - 'area:worker-jobs'
        - 'area:world'
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - 'M0 · Nền móng'
        - 'M1 · Giao diện và Identity'
        - 'M2 · Lát cắt đầu'
        - 'M3 · Xèng và Payment'
        - 'M4 · Chủ tiệm'
        - 'M5 · Tích hợp game core'
        - 'M6 · Bot học tăng cường'
        - 'M7 · Chatbot, TTS và NPC'
        - 'M8 · Production'
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 'Urgent'
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Sau khi tạo, điền thanh bên phải: Labels `area:*`, Milestone, Priority, Effort. Khi nhận việc, điền thêm Assignees, Start date, Target date. Xem CONTRIBUTING.md.
  - type: input
    id: requirement
    attributes:
      label: Yêu cầu hoặc quyết định
      description: REQ hoặc ADR liên quan. Việc thuần công cụ, tài liệu thì ghi "không".
      placeholder: REQ-000
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Bối cảnh
      description: Hiện đang thế nào và vì sao cần làm. Dẫn tệp hoặc issue liên quan nếu có.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Việc cần làm
      description: Phạm vi, mỗi dòng một điều kiểm được.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Xong khi nào
      description: Cách kiểm là đã xong, người khác tự kiểm được.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Ngoài phạm vi
      description: Điều dễ bị hiểu là thuộc việc này nhưng không làm ở đây.
