name: Lệch nghiệp vụ hoặc câu hỏi cần chốt
description: Việc đang làm trái với REQ hoặc ADR, hoặc chưa có REQ nào phủ
type: Task
labels: [needs-decision]
body:
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options:
        - 'area:admin'
        - 'area:ai-chat'
        - 'area:config'
        - 'area:contracts'
        - 'area:docs'
        - 'area:game'
        - 'area:game-assets'
        - 'area:game-shared'
        - 'area:identity'
        - 'area:infra'
        - 'area:media'
        - 'area:nest-kit'
        - 'area:notification'
        - 'area:payment'
        - 'area:shop'
        - 'area:ui'
        - 'area:web-3d'
        - 'area:worker-ai'
        - 'area:worker-asset'
        - 'area:worker-jobs'
        - 'area:world'
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - 'M0 · Nền móng'
        - 'M1 · Giao diện và Identity'
        - 'M2 · Lát cắt đầu'
        - 'M3 · Xèng và Payment'
        - 'M4 · Chủ tiệm'
        - 'M5 · Tích hợp game core'
        - 'M6 · Bot học tăng cường'
        - 'M7 · Chatbot, TTS và NPC'
        - 'M8 · Production'
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 'Urgent'
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      options:
        - 'High'
        - 'Medium'
        - 'Low'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Sau khi tạo, điền thanh bên phải: Labels `area:*`, Milestone, Priority, Effort, và Assignees là người cần quyết định. Xem CONTRIBUTING.md.
  - type: input
    id: related
    attributes:
      label: REQ hoặc ADR liên quan
      placeholder: REQ-000, ADR-0000
  - type: textarea
    id: context
    attributes:
      label: Tình huống
      description: Đang làm gì, lệch ở đâu, issue nào đang bị chặn.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Các lựa chọn và hệ quả
      placeholder: |
        1. ... (đề xuất), vì ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Xong khi nào
      description: Quyết định được ghi vào đâu, ví dụ sổ yêu cầu hoặc một ADR mới.
    validations:
      required: true
  - type: input
    id: decider
    attributes:
      label: Ai cần quyết định
      placeholder: Mentor, nhóm
