name: secret-scan

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner --exit-code 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Scan for student IDs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/security/scan-denylist.mjs --commit-range "origin/$BASE_REF..HEAD"
          else
            node scripts/security/scan-denylist.mjs
          fi
