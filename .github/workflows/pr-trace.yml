name: pr-trace

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Check contracts and list what changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          node packages/contracts/check.mjs --base "origin/$BASE_REF" > contracts-report.txt 2>&1 || status=$?
          cat contracts-report.txt
          {
            echo '### Contract changes'
            echo '```'
            cat contracts-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Check traceability and branch flow
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          node scripts/trace/check-pr.mjs \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --head-repository "$HEAD_REPOSITORY" \
            --author "$PR_AUTHOR" \
            --body-file "$RUNNER_TEMP/pr-body.txt"
