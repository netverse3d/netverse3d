name: assets

on:
  pull_request:
    paths:
      - packages/game-assets/**
      - .github/workflows/assets.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node packages/game-assets/tools/check.mjs --require-content
