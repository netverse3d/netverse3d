name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options: [staging, production]
      version:
        description: Version, for example 0.1.0
        type: string
        required: true

permissions:
  contents: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read checks of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --paginate --jq '.check_runs' | jq -s 'add' > "$RUNNER_TEMP/checks.json"
      - id: validate
        name: Validate release
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release/validate.mjs \
            --environment "$RELEASE_ENVIRONMENT" \
            --version "$RELEASE_VERSION" \
            --branch "$GITHUB_REF_NAME" \
            --checks-file "$RUNNER_TEMP/checks.json"

  tag-staging:
    needs: validate
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: release-staging
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA"

  tag-production:
    needs: validate
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA"
