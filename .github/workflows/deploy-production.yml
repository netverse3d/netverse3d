name: deploy-production

on:
  push:
    tags: ['prod-v*']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.plan.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/release/plan-images.mjs "$GITHUB_REF_NAME"

  promote-images:
    needs: plan
    if: needs.plan.outputs.components != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.plan.outputs.components) }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse the image tested on staging
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.component.id }}
          SOURCE_TAG: ${{ matrix.component.sourceTag }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:$SOURCE_TAG"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
