name: docs

on:
  push:
    branches: [staging]
    paths:
      - docs/**
      - packages/game-assets/library/**
      - packages/game-assets/exported/**
      - packages/game-assets/tools/**
      - .github/workflows/docs.yml

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm --filter @netverse/docs build
      - run: git lfs pull --include="packages/game-assets/exported/*,packages/game-assets/library/models/*"
      - run: node packages/game-assets/tools/publish-library.mjs docs/.vitepress/dist/game-assets
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
