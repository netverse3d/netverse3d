name: ci

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:repo

  plan:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.plan.outputs.units }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/ci/affected.mjs --base "origin/$BASE_REF"
          else
            node scripts/ci/affected.mjs
          fi

  unit:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.unit.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          UNIT_PACKAGE: ${{ matrix.unit.package }}
        run: pnpm exec turbo run lint test build --filter="$UNIT_PACKAGE"
      - name: Start a database for end-to-end tests
        if: matrix.unit.e2e
        run: |
          docker run -d --name e2e-database -e POSTGRES_PASSWORD=e2e -e POSTGRES_DB=e2e -p 127.0.0.1:5432:5432 postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec e2e-database pg_isready -U postgres -d e2e > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "The database did not become ready" >&2
          exit 1
      - name: Start Kafka for end-to-end tests
        if: matrix.unit.e2e
        run: docker compose --env-file .env.example -f infra/compose/compose.yaml up -d --wait kafka
      - name: Run end-to-end tests
        if: matrix.unit.e2e
        env:
          UNIT_PACKAGE: ${{ matrix.unit.package }}
          DATABASE_URL: postgresql://postgres:e2e@127.0.0.1:5432/e2e
          KAFKA_TEST_BROKERS: 127.0.0.1:59092
        run: pnpm exec turbo run test:e2e --filter="$UNIT_PACKAGE"

  verify:
    needs: [repo, plan, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/conclude.mjs
