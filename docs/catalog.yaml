components:
  - id: web-3d
    path: apps/web-3d
    kind: app
    stack: Next.js, Three.js
    summary: Web 3D và PWA cho người chơi và chủ tiệm
    milestone: M1
  - id: admin
    path: apps/admin
    kind: app
    stack: Next.js
    summary: Quản trị hệ thống
    milestone: M1
  - id: identity
    path: services/identity
    kind: service
    stack: NestJS, Prisma, PostgreSQL
    summary: Đăng ký, đăng nhập, JWT, RBAC
    milestone: M1
    maps_to: Đăng ký, đăng nhập, token, vai trò trong ứng dụng nghiệp vụ
  - id: shop
    path: services/shop
    kind: service
    stack: NestJS, Prisma
    summary: Người dùng, tiệm, máy, thuê đất, giờ máy, điểm doanh thu, cấu hình
    milestone: M3
    maps_to: Tiệm, máy, quyền dùng máy, trang tổng quan quản trị
  - id: world
    path: services/world
    kind: service
    stack: NestJS, Prisma
    summary: Thế giới, bản đồ, bố cục, phòng net
    milestone: M4
    maps_to: Bố cục tiệm bản nháp và bản phát hành, vé vào phòng
  - id: media
    path: services/media
    kind: service
    stack: NestJS, Prisma, PostgreSQL, object storage chuẩn S3
    summary: Asset 3D, ảnh, âm thanh, metadata, object storage chuẩn S3, CDN
    milestone: M2
    maps_to: Tải lên bằng URL ký sẵn, duyệt asset, danh mục asset
  - id: payment
    path: services/payment
    kind: service
    stack: NestJS, Prisma
    summary: PayOS, nạp Xèng, sổ cái số dư, webhook, hoá đơn
    milestone: M3
    maps_to: Ứng dụng thanh toán và tiến trình chuyển sự kiện thanh toán
  - id: ai-chat
    path: services/ai-chat
    kind: service
    stack: Python
    summary: Chatbot LLM chạy local và TTS tiếng Việt
    milestone: M7
    maps_to: Ứng dụng AI
  - id: notification
    path: services/notification
    kind: service
    stack: NestJS, Prisma, PostgreSQL
    summary: Thông báo qua email, push và hộp thư trong ứng dụng
    milestone: M3
  - id: game
    path: services/game
    kind: service
    stack: Go theo bản mẫu của mentor, chưa nhận mã
    summary: Game Gateway và Authoritative Room Server
    milestone: M5
    maps_to: Game server
  - id: worker-asset
    path: workers/asset
    kind: worker
    stack: Chưa chốt
    summary: Xử lý GLB, nén, chuyển đổi asset
    milestone: M2
  - id: worker-ai
    path: workers/ai
    kind: worker
    stack: Python
    summary: Mô phỏng headless, huấn luyện và chạy bot học tăng cường; hàng đợi LLM, TTS
    milestone: M6
  - id: worker-jobs
    path: workers/jobs
    kind: worker
    stack: Chưa chốt
    summary: Gia hạn, dọn dữ liệu, thống kê định kỳ
    milestone: M3
  - id: contracts
    path: packages/contracts
    kind: package
    stack: OpenAPI, JSON Schema
    summary: Hợp đồng HTTP, sự kiện Kafka và giao thức realtime
    milestone: M0
    maps_to: Thư mục hợp đồng
  - id: game-shared
    path: packages/game-shared
    kind: package
    stack: TypeScript
    summary: Luật di chuyển và va chạm dùng chung giữa client và game server
    milestone: M2
  - id: ui
    path: packages/ui
    kind: package
    stack: React
    summary: Thành phần giao diện dùng chung
    milestone: M1
  - id: config
    path: packages/config
    kind: package
    stack: TypeScript
    summary: Cấu hình dùng chung cho lint, TypeScript
    milestone: M1
  - id: game-assets
    path: packages/game-assets
    kind: package
    stack: Blender, glTF
    summary: Tệp Blender gốc, mô hình xuất ra và bộ kiểm của nhân vật, đồ vật
    milestone: M1
  - id: nest-kit
    path: packages/nest-kit
    kind: package
    stack: NestJS
    summary: Bộ khung dùng chung của các service NestJS, gồm response, lỗi, phân trang, xác thực, log
    milestone: M1
areas:
  - path: apps
    summary: Giao diện chạy trên trình duyệt
  - path: services
    summary: Tiến trình phục vụ API hoặc kết nối realtime, mỗi service một thư mục
  - path: workers
    summary: Tiến trình xử lý việc nền
  - path: packages
    summary: Mã và dữ liệu dùng chung, không tự triển khai
  - path: infra
    summary: Hạ tầng chạy hệ thống, gồm Compose, cổng vào và cấu hình quan sát
  - path: tests
    summary: Kiểm chạy trên nhiều thành phần cùng lúc, gồm kiểm chuẩn, đầu cuối và tải
  - path: scripts
    summary: Công cụ của repo để kiểm, sinh tài liệu và phát hành
  - path: docs
    summary: Yêu cầu, quyết định, wiki và runbook
