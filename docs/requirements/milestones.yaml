milestones:
  - id: M0
    title: M0 · Nền móng
    goal: Repo, quy trình, CI, tài liệu và hạ tầng dev sẵn sàng cho cả nhóm.
  - id: M1
    title: M1 · Giao diện và Identity
    goal: Người dùng đăng ký, đăng nhập, tạo nhân vật và thấy được giao diện 3D; có trang quản trị.
  - id: M2
    title: M2 · Lát cắt đầu
    goal: Một tiệm dựng sẵn chạy với room server giả theo giao thức nháp; người chơi vào tiệm, ngồi máy, dùng màn hình máy và chơi game đầu tiên một mình.
  - id: M3
    title: M3 · Xèng và Payment
    goal: Nạp Xèng qua PayOS ở môi trường thử, sổ cái số dư, trả giờ máy bằng Xèng, lịch sử giao dịch và thông báo.
  - id: M4
    title: M4 · Chủ tiệm
    goal: Chủ tiệm thuê đất, xây và bài trí tiệm, nhận điểm doanh thu; người chơi khám phá và chọn tiệm.
  - id: M5
    title: M5 · Tích hợp game core
    goal: Nhận core của mentor thay room server giả; nhiều tiệm, nhiều phòng, giao lưu, màn hình chung và từ 100 người mỗi phòng.
  - id: M6
    title: M6 · Bot học tăng cường
    goal: Bot huấn luyện bằng học tăng cường chơi game trên máy, đấu với người và xuất hiện trong tiệm.
  - id: M7
    title: M7 · Chatbot, TTS và NPC
    goal: Chatbot LLM chạy local, đọc hội thoại bằng tiếng Việt và NPC phục vụ trong quán.
  - id: M8
    title: M8 · Production
    goal: Chạy trên Kubernetes, có quan sát hệ thống, đạt mục tiêu tải và sẵn sàng bảo vệ.
