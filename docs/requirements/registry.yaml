requirements:
  - id: REQ-001
    title: Đăng ký và đăng nhập bằng tài khoản
    description: Người dùng tạo tài khoản, đăng nhập và duy trì phiên làm việc an toàn.
    status: accepted
    priority: must
    milestone: M1
    area: identity
    sources: [mentor-architecture-full, mentor-architecture-lite, mentor-demo]
  - id: REQ-002
    title: Phân quyền theo vai trò người chơi, chủ tiệm, quản trị
    description: Một người dùng có thể vừa là người chơi vừa là chủ tiệm; quản trị là vai trò riêng.
    status: accepted
    priority: must
    milestone: M1
    area: identity
    sources: [mentor-brief, mentor-architecture-full]
  - id: REQ-003
    title: Tạo và chỉnh nhân vật
    description: Người chơi tạo nhân vật trước khi vào thế giới, tự chọn tóc, trang phục, phụ kiện và màu từng phần trên một bộ xương chung. Tài khoản lưu công thức nhân vật, có hồ sơ hiển thị với người khác.
    status: draft
    priority: must
    milestone: M1
    area: web-3d
    sources: [mentor-architecture-lite, mentor-demo, team-decision]
  - id: REQ-004
    title: Web 3D chạy trên máy tính và điện thoại
    description: Giao diện 3D dùng được trên trình duyệt máy tính và trên điện thoại dạng PWA, có điều khiển phím và cần ảo.
    status: accepted
    priority: must
    milestone: M1
    area: web-3d
    sources: [mentor-architecture-full, mentor-architecture-lite, mentor-demo]
  - id: REQ-005
    title: Trang quản trị hệ thống
    description: Quản trị viên quản lý người dùng, xem thống kê và cấu hình hệ thống.
    status: draft
    priority: must
    milestone: M1
    area: admin
    sources: [mentor-architecture-full, mentor-architecture-lite, mentor-demo]
  - id: REQ-006
    title: Lưu trữ và phân phối asset 3D
    description: Quản lý GLB, texture, âm thanh, hoạt ảnh và metadata trên object storage chuẩn S3, phân phối được qua CDN. Sơ đồ ghi MinIO; sản phẩm cụ thể còn là câu hỏi mở.
    status: draft
    priority: must
    milestone: M2
    area: media
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-007
    title: Người dùng tải lên ảnh và âm thanh có kiểm soát
    description: Giới hạn định dạng, dung lượng và có đường xử lý nội dung vi phạm.
    status: draft
    priority: should
    milestone: M4
    area: media
    sources: [mentor-demo]
  - id: REQ-008
    title: Thông báo realtime, trong ứng dụng và email
    description: Người dùng nhận được thông báo về thanh toán, gia hạn và sự kiện của tiệm.
    status: draft
    priority: must
    milestone: M3
    area: notification
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-009
    title: Chủ tiệm thuê đất để mở tiệm
    description: Muốn mở tiệm net, người dùng phải thuê một khu đất trong thế giới trước.
    status: accepted
    priority: must
    milestone: M4
    area: core-api
    sources: [mentor-brief, mentor-architecture-full]
  - id: REQ-010
    title: Thanh toán qua PayOS
    description: PayOS chỉ dùng để nạp Xèng. Webhook được xác thực và xử lý lặp an toàn. Chạy môi trường thử cho tới khi có quyết định khác.
    status: draft
    priority: must
    milestone: M3
    area: payment
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-011
    title: Thuê máy theo thời gian và gia hạn
    description: Người chơi trả Xèng theo từng block thời gian trả trước, giá do tiệm đặt; hết block thì gia hạn hoặc rời máy. Room server dừng giữa chừng không làm mất hay trừ thêm tiền. Sơ đồ ghi 1.000đ một máy; giá quy ra Xèng còn mở.
    status: draft
    priority: must
    milestone: M3
    area: core-api
    sources: [mentor-architecture-lite, mentor-demo]
  - id: REQ-012
    title: Hoá đơn và lịch sử giao dịch
    description: Người dùng và chủ tiệm xem được hoá đơn, lịch sử thanh toán của mình.
    status: draft
    priority: should
    milestone: M3
    area: payment
    sources: [mentor-architecture-lite]
  - id: REQ-013
    title: Chủ tiệm xây dựng và bài trí tiệm
    description: Sau khi thuê đất, chủ tiệm vào chế độ xây dựng để đặt máy, bàn ghế, trang trí và chọn màu nhấn của tiệm.
    status: accepted
    priority: must
    milestone: M4
    area: world
    sources: [mentor-brief, mentor-architecture-lite]
  - id: REQ-014
    title: Người chơi khám phá và chọn tiệm bất kỳ
    description: Người chơi xem danh sách tiệm, số máy còn trống, số người online và chọn tiệm để vào.
    status: accepted
    priority: must
    milestone: M4
    area: world
    sources: [mentor-brief, mentor-architecture-lite]
  - id: REQ-015
    title: Duyệt tiệm và nội dung
    description: Quản trị viên duyệt tiệm và xử lý nội dung vi phạm.
    status: draft
    priority: should
    milestone: M4
    area: admin
    sources: [mentor-architecture-lite]
  - id: REQ-016
    title: Nâng cấp tiệm và danh tiếng
    description: Tiệm có danh tiếng, chủ tiệm dùng điểm doanh thu để mở rộng không gian và thêm máy.
    status: draft
    priority: should
    milestone: M4
    area: core-api
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-017
    title: Vào tiệm và di chuyển đa người realtime
    description: Nhiều người chơi cùng ở trong một tiệm, thấy nhau di chuyển với độ trễ thấp, server có thẩm quyền.
    status: accepted
    priority: must
    milestone: M5
    area: game
    sources: [mentor-brief, mentor-architecture-full, mentor-demo]
  - id: REQ-018
    title: Ngồi vào máy và giữ chỗ không trùng
    description: Một máy chỉ có một người dùng tại một thời điểm, kể cả khi nhiều người tranh cùng lúc.
    status: accepted
    priority: must
    milestone: M5
    area: game
    sources: [mentor-brief, mentor-architecture-full, mentor-demo]
  - id: REQ-019
    title: Từ 100 người trở lên trong một phòng
    description: Một phòng giữ được tối thiểu 100 người chơi ổn định; game server mở rộng được theo chiều ngang.
    status: draft
    priority: should
    milestone: M5
    area: game
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-020
    title: Giao lưu giữa người chơi
    description: Người chơi trò chuyện và kết bạn trong tiệm. Phạm vi chat, voice còn là câu hỏi mở.
    status: draft
    priority: should
    milestone: M5
    area: game
    sources: [mentor-architecture-lite, mentor-demo]
  - id: REQ-021
    title: Máy bán nước và đồ ăn trong tiệm
    description: Người chơi mua đồ ăn thức uống ảo từ máy bán hàng trong tiệm.
    status: draft
    priority: could
    milestone: M5
    area: game
    sources: [mentor-architecture-lite]
  - id: REQ-022
    title: Chatbot AI trên máy tính trong game
    description: Người chơi ngồi vào máy và trò chuyện với chatbot dùng LLM chạy local.
    status: draft
    priority: should
    milestone: M7
    area: ai-chat
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-023
    title: Đọc hội thoại bằng TTS tiếng Việt
    description: Hội thoại của chatbot và NPC được đọc bằng giọng tiếng Việt chạy local.
    status: draft
    priority: should
    milestone: M7
    area: ai-chat
    sources: [mentor-architecture-full, mentor-architecture-lite]
  - id: REQ-024
    title: NPC phục vụ quán net huấn luyện bằng Reinforcement Learning
    description: Bắt đầu từ một NPC giao đồ trong quán, huấn luyện trên mô phỏng headless, kiểm định độc lập rồi mới đưa vào tiệm.
    status: draft
    priority: could
    milestone: M7
    area: worker-ai
    sources: [mentor-chat-npc, mentor-chat-arena]
  - id: REQ-025
    title: Quan sát hệ thống bằng metric, log và trace
    description: Có Prometheus, Grafana, Loki và OpenTelemetry cho mọi service.
    status: draft
    priority: should
    milestone: M8
    area: infra
    sources: [mentor-architecture-full]
  - id: REQ-026
    title: Triển khai production trên Kubernetes
    description: Hệ thống chạy trên Kubernetes, có Kafka cho sự kiện và hàng đợi việc nền.
    status: draft
    priority: must
    milestone: M8
    area: infra
    sources: [mentor-architecture-full, team-decision]
  - id: REQ-027
    title: Tách staging và production, phát hành theo tag
    description: Mọi thay đổi được test trên staging trước; tag kích hoạt phát hành, ai trong nhóm cũng phát hành được nếu đúng quy trình.
    status: accepted
    priority: must
    milestone: M0
    area: infra
    sources: [team-decision]
  - id: REQ-028
    title: Tiền ảo Xèng nạp một chiều
    description: Người dùng nạp tiền thật để nhận Xèng và chỉ tiêu trong Netverse. Không rút, không chuyển cho người khác, không đổi ngược ra tiền. Xèng là tên tạm.
    status: draft
    priority: must
    milestone: M3
    area: payment
    sources: [team-decision]
  - id: REQ-029
    title: Sổ cái số dư ghi kép
    description: Mọi thay đổi số dư Xèng và điểm doanh thu đi qua sổ cái ghi kép, không sửa số dư trực tiếp. Mỗi lần nạp gắn với mã đơn để webhook lặp lại không cộng hai lần.
    status: draft
    priority: must
    milestone: M3
    area: payment
    sources: [team-decision]
  - id: REQ-030
    title: Điểm doanh thu của chủ tiệm
    description: Xèng người chơi trả cho giờ máy bị huỷ, hệ thống cấp điểm doanh thu cho chủ tiệm theo một tỷ lệ. Điểm chỉ dùng để thuê đất, mua máy, nâng cấp tiệm; không chuyển, không đổi ra Xèng. Chủ tiệm dùng máy tiệm mình không tạo điểm; bot khách tạo điểm có giới hạn theo REQ-038.
    status: draft
    priority: must
    milestone: M4
    area: core-api
    sources: [team-decision, mentor-architecture-lite]
  - id: REQ-031
    title: Phút miễn phí hằng ngày do hệ thống cấp
    description: Thay cho tặng phút giữa người chơi trong bản demo, hệ thống cấp một lượng thời gian miễn phí mỗi ngày.
    status: draft
    priority: could
    milestone: M3
    area: payment
    sources: [mentor-demo, team-decision]
  - id: REQ-032
    title: Màn hình máy cá nhân
    description: Ngồi vào máy thì mở lớp màn hình 2D gồm game của Netverse, trình duyệt nhúng theo danh sách cho phép và video nhúng. Người khác thấy ảnh xem trước trên màn hình 3D của máy đó.
    status: accepted
    priority: must
    milestone: M2
    area: web-3d
    sources: [mentor-demo, mentor-followup]
  - id: REQ-033
    title: Game đầu tiên trên máy
    description: Một game web do nhóm tự thiết kế, chơi được trên màn hình máy. Luật game viết một lần dưới dạng bước tất định để dùng chung cho giao diện, huấn luyện và chấm điểm bot.
    status: draft
    priority: must
    milestone: M2
    area: web-3d
    sources: [mentor-followup, mentor-chat-arena]
  - id: REQ-034
    title: Màn hình chung của tiệm
    description: Mỗi tiệm có màn hình lớn do chủ tiệm chọn nội dung như video xem chung, trận đấu đang diễn ra, bảng xếp hạng. Nội dung đồng bộ bằng trạng thái, mỗi máy tự hiển thị.
    status: draft
    priority: should
    milestone: M5
    area: game
    sources: [mentor-followup, mentor-demo]
  - id: REQ-035
    title: Bot học tăng cường chơi game trên máy
    description: Bot huấn luyện bằng học tăng cường trên mô phỏng headless, kiểm định độc lập rồi mới được vào tiệm. Bot ngồi máy, chơi và đấu với người, luôn hiện rõ là bot. Chỉ bot khách tạo điểm doanh thu, theo REQ-038.
    status: draft
    priority: should
    milestone: M6
    area: worker-ai
    sources: [mentor-followup, mentor-chat-npc, mentor-chat-arena]
  - id: REQ-036
    title: Vào tiệm dựng sẵn và ngồi máy với room server giả
    description: Trong lúc chờ core của mentor, người chơi vào một tiệm dựng sẵn bằng tài khoản khách, đi lại, thuê miễn phí và ngồi vào máy một mình trên room server giả theo giao thức nháp. Trừ Xèng được nối ở M3. Bản giả chỉ dùng để phát triển và test, không triển khai.
    status: accepted
    priority: must
    milestone: M2
    area: web-3d
    sources: [team-decision, mentor-architecture-lite]
  - id: REQ-037
    title: Biểu cảm nhân vật khi chơi
    description: Người chơi đổi được giữa mười hai biểu cảm khi đang chơi và người xung quanh nhìn thấy. Biểu cảm là trạng thái lúc chơi, không lưu trong công thức nhân vật.
    status: draft
    priority: should
    milestone: M5
    area: web-3d
    sources: [team-decision]
  - id: REQ-038
    title: Bot khách cho tiệm vắng
    description: Tiệm vắng có bot khách đi lại, chọn máy và ngồi chơi như người, luôn hiện rõ là bot. Chỉ tiệm mới nhận điểm doanh thu từ bot khách, có trần theo ngày và thấp hơn nhiều so với khách thật.
    status: draft
    priority: should
    milestone: M5
    area: game
    sources: [mentor-followup, team-decision]
  - id: REQ-039
    title: Thế giới mang bối cảnh Sài Gòn cyber
    description: Một con hẻm và tiệm mẫu theo bối cảnh TP.HCM phiên bản cyber về đêm và chuẩn mỹ thuật ở ADR-0014, làm khuôn cho các khu sau này. Phố lắp từ module trên lưới ô đường 4 m, lô tiệm 8 × 8 m nhìn ra hẻm rộng 4 m. Có xe máy và ô tô đậu trước tiệm và chạy theo làn; người qua lại là bot robot trên vỉa hè. Đường chân trời gợi hình TP.HCM, không chép và không dùng tên công trình. Pháo hoa vào các dịp lễ Tết.
    status: accepted
    priority: should
    milestone: M2
    area: web-3d
    sources: [team-decision]
  - id: REQ-040
    title: Mỗi tiệm có bản sắc riêng
    description: Một con phố có nhiều tiệm và mỗi tiệm trông khác nhau. Hình dáng và màu của đồ đạc, gồm cả gradient nhiều màu như bàn phím, cùng bố cục, biển hiệu và kiểu đèn được lưu thành công thức của tiệm. Các tiệm dùng chung một bộ mô hình.
    status: accepted
    priority: must
    milestone: M2
    area: game-assets
    sources: [team-decision]
  - id: REQ-041
    title: Góc console trong tiệm
    description: Tiệm có thể có một góc giải trí riêng với sofa, bàn trà, máy console, tay cầm và TV lớn để người chơi ngồi chơi chung. Bộ mô hình dùng chung cơ chế ô đồ và đổi màu theo công thức tiệm; vị trí của góc này trong bố cục tiệm chốt sau.
    status: draft
    priority: should
    milestone: M2
    area: game-assets
    sources: [team-decision]
  - id: REQ-042
    title: Thành phố mở nhiều khu
    description: Thế giới ngoài tiệm là một thành phố mở gồm nhiều khu nối nhau, người chơi đi bộ từ hẻm ra đường lớn. Đường có nhiều cấp, từ hẻm 4 m tới đại lộ nhiều làn, có ngã ba, ngã tư, vạch qua đường và đèn tín hiệu; xe chạy theo làn và theo đèn. Thành phố có lô đất, toà nhà phức hợp, công viên, sông và cầu. Công trình nổi tiếng chỉ gợi hình, mang tên riêng của Netverse, theo ADR-0014. Mọi thứ hiện trong thành phố là thành phần đã đăng ký trong thư viện 3D và dùng chung một chuẩn ánh sáng, đổ bóng, theo ADR-0019. Thành phố dựng theo từng đợt, đợt đầu là một khu mẫu có một trục đường lớn và một ngã tư có đèn.
    status: accepted
    priority: should
    milestone: M4
    area: web-3d
    sources: [team-decision]
