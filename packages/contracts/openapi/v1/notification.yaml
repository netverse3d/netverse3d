info:
  title: media
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiResponseDto:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
          example: null
        result:
          type: object
          nullable: true
        requestId:
          type: string
          nullable: true
      required:
        - code
        - message
        - result
        - requestId
    PageResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        page:
          type: number
          example: 1
        size:
          type: number
          example: 20
        totalElements:
          type: number
          example: 42
        totalPages:
          type: number
          example: 3
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    AuditLogResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        actorSubject:
          type: string
          nullable: true
        actorRoles:
          type: array
          items:
            type: string
        ip:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        outcome:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        errorCode:
          type: string
          nullable: true
        metadata:
          type: object
      required:
        - id
        - occurredAt
        - requestId
        - tenantId
        - actorSubject
        - actorRoles
        - ip
        - action
        - resourceType
        - resourceId
        - outcome
        - errorCode
        - metadata
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
      required:
        - status
        - version
    DeliveryStateDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
            - EMAIL
            - PUSH
            - IN_APP
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - SENT
            - SKIPPED
            - DEAD
        reason:
          type: string
          nullable: true
      required:
        - id
        - channel
        - status
        - reason
    AcceptedNotificationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        locale:
          type: string
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStateDto'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - locale
        - deliveries
        - createdAt
    RecipientDto:
      type: object
      properties:
        subject:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 320
        deviceTokens:
          maxItems: 100
          type: array
          items:
            type: string
    SendNotificationDto:
      type: object
      properties:
        eventType:
          type: string
          example: account.welcome
          maxLength: 128
        recipient:
          $ref: '#/components/schemas/RecipientDto'
        variables:
          type: object
          additionalProperties: true
        locale:
          type: string
          example: en
          maxLength: 16
        expiresAt:
          type: string
          format: date-time
          description: RFC 3339 moment with a time zone, at most 30 days ahead; after it the notification is dropped instead of sent late
        channels:
          type: array
          items:
            type: string
            enum:
              - EMAIL
              - PUSH
              - IN_APP
      required:
        - eventType
        - recipient
    TemplateResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        channel:
          type: string
          enum:
            - EMAIL
            - PUSH
            - IN_APP
        locale:
          type: string
        subject:
          type: string
        body:
          type: string
        category:
          type: string
          enum:
            - TRANSACTIONAL
            - OPTIONAL
        version:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - channel
        - locale
        - subject
        - body
        - category
        - version
        - createdAt
        - updatedAt
    CreateTemplateDto:
      type: object
      properties:
        eventType:
          type: string
          example: account.welcome
          maxLength: 128
        channel:
          type: string
          enum:
            - EMAIL
            - PUSH
            - IN_APP
        locale:
          type: string
          example: en
          maxLength: 16
        subject:
          type: string
          description: Handlebars source of the subject or title
          maxLength: 1000
        body:
          type: string
          description: Handlebars source of the body
          maxLength: 100000
        category:
          type: string
          enum:
            - TRANSACTIONAL
            - OPTIONAL
          description: TRANSACTIONAL is always sent and exists only in the platform scope
      required:
        - eventType
        - channel
        - locale
        - subject
        - body
    UpdateTemplateDto:
      type: object
      properties:
        subject:
          type: string
          maxLength: 1000
        body:
          type: string
          maxLength: 100000
        category:
          type: string
          enum:
            - TRANSACTIONAL
            - OPTIONAL
          description: TRANSACTIONAL is always sent and exists only in the platform scope
    BrandingEntryResponseDto:
      type: object
      properties:
        key:
          type: string
          example: logoUrl
          maxLength: 64
        value:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - key
        - value
        - updatedAt
    BrandingResponseDto:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BrandingEntryResponseDto'
      required:
        - entries
    PutBrandingEntryDto:
      type: object
      properties:
        value:
          type: string
          maxLength: 4000
      required:
        - value
    OptOutResponseDto:
      type: object
      properties:
        channel:
          type: string
          enum:
            - EMAIL
            - PUSH
            - IN_APP
        eventType:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - channel
        - eventType
        - createdAt
    OptOutListResponseDto:
      type: object
      properties:
        optOuts:
          type: array
          items:
            $ref: '#/components/schemas/OptOutResponseDto'
      required:
        - optOuts
    OptOutKeyDto:
      type: object
      properties:
        channel:
          type: string
          enum:
            - EMAIL
            - PUSH
            - IN_APP
        eventType:
          type: string
          example: account.welcome
          maxLength: 128
      required:
        - channel
        - eventType
    BlockedAddressResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - address
        - reason
        - createdAt
    BlockAddressDto:
      type: object
      properties:
        address:
          type: string
          maxLength: 512
        reason:
          type: string
          maxLength: 255
      required:
        - address
    InboxItemResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        title:
          type: string
        body:
          type: string
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - title
        - body
        - readAt
        - createdAt
    UnreadCountResponseDto:
      type: object
      properties:
        count:
          type: number
      required:
        - count
    MarkAllReadResponseDto:
      type: object
      properties:
        updated:
          type: number
      required:
        - updated
    DeliveryLogEntryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notificationId:
          type: string
          format: uuid
        eventType:
          type: string
        channel:
          type: string
          enum:
            - EMAIL
            - PUSH
            - IN_APP
        destination:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - PROCESSING
            - SENT
            - SKIPPED
            - DEAD
        attempts:
          type: number
        reason:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        templateVersion:
          type: number
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - notificationId
        - eventType
        - channel
        - destination
        - status
        - attempts
        - reason
        - detail
        - templateVersion
        - nextAttemptAt
        - sentAt
        - createdAt
        - updatedAt
    ApiErrorResponseDto:
      type: object
      properties:
        code:
          type: string
          example: COMMON.VALIDATION
        message:
          type: string
          example: Request validation failed
        details:
          type: object
          nullable: true
        path:
          type: string
          example: /v1/examples
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
      required:
        - code
        - message
        - path
        - timestamp
        - requestId
security:
  - bearer: []
