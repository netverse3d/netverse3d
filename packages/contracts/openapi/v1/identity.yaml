  /v1/audit-logs:
    get:
      operationId: AuditLogsController_list_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: size
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: sort
          required: false
          in: query
          schema:
            example: createdAt,desc
            type: string
        - name: action
          required: false
          in: query
          schema:
            type: string
        - name: resourceType
          required: false
          in: query
          schema:
            type: string
        - name: resourceId
          required: false
          in: query
          schema:
            type: string
        - name: actorSubject
          required: false
          in: query
          schema:
            type: string
        - name: from
          required: false
          in: query
          schema:
            format: date-time
            type: string
        - name: to
          required: false
          in: query
          schema:
            format: date-time
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponseDto'
                  - properties:
                      result:
                        allOf:
                          - $ref: '#/components/schemas/PageResponseDto'
                          - properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/AuditLogResponseDto'
        '400':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '401':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '403':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '429':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '500':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      summary: List audit log entries, newest first
      tags:
        - audit-logs
