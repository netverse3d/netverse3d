info:
  title: identity
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiResponseDto:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
          example: null
        result:
          type: object
          nullable: true
        requestId:
          type: string
          nullable: true
      required:
        - code
        - message
        - result
        - requestId
    PageResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        page:
          type: number
          example: 1
        size:
          type: number
          example: 20
        totalElements:
          type: number
          example: 42
        totalPages:
          type: number
          example: 3
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    AuditLogResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        actorSubject:
          type: string
          nullable: true
        actorRoles:
          type: array
          items:
            type: string
        ip:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        outcome:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        errorCode:
          type: string
