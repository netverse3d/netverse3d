<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Món đồ · Thư viện 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shared/gallery.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body class="gallery gallery-live">
    <canvas class="live-canvas" id="gl" aria-hidden="true"></canvas>
    <aside class="gallery-nav" id="nav"></aside>
    <main class="gallery-main gallery-wide">
      <header class="page-head">
        <div class="stage-name">
          <h1 id="page-title">Món đồ</h1>
          <span id="page-badge"></span>
        </div>
        <p class="stage-summary" id="page-summary"></p>
        <div class="stage-bar">
          <nav class="stage-tabs" id="page-tabs" aria-label="Các trang trong mục"></nav>
        </div>
      </header>

      <p class="notice" id="problem" hidden>
        Không đọc được dữ liệu của thư viện. Hãy mở trang qua lệnh <code>pnpm assets:library</code>.
      </p>
      <p class="notice" id="no-webgl" hidden>
        Trình duyệt này chưa bật WebGL 2 nên không vẽ được mô hình.
      </p>
      <p class="status" id="status" role="status">Đang nạp mô hình…</p>

      <form class="tools" id="tools" hidden onsubmit="return false;">
        <label class="field">
          <span>Bộ màu tiệm</span>
          <select id="recipe"></select>
        </label>
        <label class="field">
          <span>Bộ màu phím</span>
          <select id="colorway"></select>
        </label>
        <label class="field">
          <span>LED phím</span>
          <select id="led"></select>
        </label>
        <label class="field field-grow">
          <span>Tìm món</span>
          <input id="search" type="search" placeholder="desk, ghế, mic_b…" autocomplete="off" />
        </label>
        <div class="field">
          <span>Bộ</span>
          <div class="chips" id="kits"></div>
        </div>
        <div class="field">
          <span>Hiển thị</span>
          <div class="chips">
            <button class="chip" id="spin" type="button" aria-pressed="true">Tự xoay</button>
            <button class="chip" id="occlusion" type="button" aria-pressed="true">Bóng khe</button>
          </div>
        </div>
        <p class="tools-count" id="count" role="status"></p>
      </form>

      <p class="status" id="empty" hidden>Không có món nào khớp. Thử chữ khác hoặc chọn bộ khác.</p>
      <div id="catalog"></div>
    </main>
    <script type="module" src="shared/parts.mjs"></script>
  </body>
</html>
