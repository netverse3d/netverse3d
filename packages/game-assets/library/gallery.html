<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh mục món đồ Netverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #141418;
        --panel: #1b1b21;
        --line: #2e2e38;
        --ink: #f0eef7;
        --muted: #9a98a8;
        --cyan: #5ce1ff;
        --violet: #a66bff;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      header,
      main {
        position: relative;
        z-index: 1;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 28px;
        align-items: flex-end;
        justify-content: space-between;
        padding: 18px 24px 10px;
        background: var(--bg);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .sub a,
      .meta a {
        color: var(--cyan);
      }
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      select,
      button {
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: var(--violet);
        background: #2a2140;
      }
      main {
        padding: 6px 24px 40px;
      }
      h2 {
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 26px 0 8px;
      }
      h3 {
        font-size: 15px;
        margin: 18px 0 8px;
      }
      h3 small {
        color: var(--muted);
        font-weight: 400;
        margin-left: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .card.chosen {
        border-color: var(--violet);
      }
      .view {
        aspect-ratio: 4 / 3;
      }
      .meta {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 2px 10px;
        align-items: baseline;
        padding: 8px 12px 10px;
        background: var(--panel);
        font-size: 13px;
        white-space: nowrap;
      }
      .meta b {
        font-family: ui-monospace, monospace;
        font-weight: 600;
      }
      .meta span {
        color: var(--muted);
      }
      .tag {
        grid-column: 1 / -1;
        min-height: 14px;
        font-size: 11px;
        color: var(--violet);
      }
      #noGL {
        margin: 40px 24px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <header>
      <div>
        <h1>Danh mục món đồ</h1>
        <p class="sub">
          Mọi biến thể của từng ô đồ, cùng một bộ màu, để chủ tiệm chọn trước khi dựng.
          <a href="index.html">Về thư viện</a> · <a href="lab.html">Phòng lab</a> ·
          <a href="shop.html">Phòng thử tiệm</a>
        </p>
      </div>
      <div class="controls">
        <label
          >Bộ màu
          <select id="recipe"></select
        ></label>
        <button id="spin" aria-pressed="true">Xoay</button>
        <button id="ao" aria-pressed="true">AO nướng</button>
      </div>
    </header>
    <main id="catalog"></main>
    <p id="noGL" hidden>Trình duyệt này không có WebGL 2 nên không vẽ được danh mục.</p>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { paletteRows } from '../runtime/shop-look.mjs';
      import { kitLightmap, shopMaterials } from '../runtime/three-shop.mjs';
      import { legendTextures } from '../runtime/keyboard-legends.mjs';

      const $ = (id) => document.getElementById(id);
      const UP = new THREE.Vector3(0, 1, 0);
      const swing = new THREE.Vector3();
      const KIT_NAMES = {
        'station-parts.glb': 'Bàn máy',
        'room-kit.glb': 'Phòng',
        'lounge-parts.glb': 'Góc console',
        'sign-parts.glb': 'Biển hiệu',
      };
      const SLOT_NAMES = {
        desk: 'Bàn',
        monitor: 'Màn hình',
        keyboard: 'Bàn phím',
        mouse: 'Chuột',
        mat: 'Lót chuột',
        headset: 'Tai nghe',
        mic: 'Micro',
        speaker: 'Loa',
        chair: 'Ghế',
        case: 'Thùng máy',
        floor: 'Sàn',
        wall: 'Tường',
        corner: 'Góc tường',
        door: 'Cửa',
        window: 'Cửa sổ',
        ceiling: 'Trần',
        light: 'Đèn trần',
        marker: 'Vạch sàn',
        sofa: 'Sofa',
        table: 'Bàn trà',
        console: 'Máy console',
        gamepad: 'Tay cầm',
        tv: 'TV',
        sign: 'Biển hiệu',
        blade: 'Biển vẫy',
      };
      const query = new URLSearchParams(location.search);

      const canvas = $('gl');
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      } catch {
        $('noGL').hidden = false;
        throw new Error('WebGL 2 is not available');
      }
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setScissorTest(true);

      const [config, ids, keyboards] = await Promise.all([
        fetch('../assets.config.json').then((r) => r.json()),
        fetch('../recipes/index.json').then((r) => r.json()),
        fetch('../keyboards.json').then((r) => r.json()),
      ]);
      const rows = paletteRows(config.palette);
      const recipes = Object.fromEntries(
        await Promise.all(
          ids.map(async (id) => [id, await fetch(`../recipes/${id}.json`).then((r) => r.json())]),
        ),
      );
      const loader = new GLTFLoader();
      const kits = Object.fromEntries(
        await Promise.all(
          config.kits.map(async (kit) => [
            kit.file,
            await loader.loadAsync(`../exported/${kit.file}`),
          ]),
        ),
      );
      const environment = new THREE.PMREMGenerator(renderer).fromScene(
        new RoomEnvironment(),
        0.04,
      ).texture;

      const state = {
        recipeId: ids.includes(query.get('recipe')) ? query.get('recipe') : 'tim-neon',
        spin: query.get('spin') !== '0',
        ao: true,
      };
      let materialSets = {};

      function rebuildMaterials() {
        for (const set of Object.values(materialSets)) {
          for (const material of Object.values(set)) {
            material.map?.dispose();
            material.emissiveMap?.dispose();
            material.dispose();
          }
        }
        const legends = legendTextures(THREE, keyboards, recipes[state.recipeId]);
        materialSets = Object.fromEntries(
          Object.entries(kits).map(([file, gltf]) => [
            file,
            shopMaterials(THREE, recipes[state.recipeId], rows, {
              glowBoost: 1.1,
              lightmap: kitLightmap(gltf.scene),
              lightmapIntensity: state.ao ? 1 : 0,
              legends,
            }),
          ]),
        );
        for (const card of cards) {
          const set = materialSets[card.kit];
          card.group.traverse((mesh) => {
            if (mesh.isMesh) mesh.material = set[mesh.userData.row] ?? set.surface;
          });
        }
      }

      function triangleCount(object) {
        let total = 0;
        object.traverse((mesh) => {
          if (!mesh.isMesh) return;
          const geometry = mesh.geometry;
          total += geometry.index
            ? geometry.index.count / 3
            : geometry.attributes.position.count / 3;
        });
        return Math.round(total);
      }

      function studio(scene) {
        const key = new THREE.DirectionalLight('#fff4e6', 1.2);
        key.position.set(3, 5, 4);
        const fill = new THREE.DirectionalLight('#dbe6ff', 0.8);
        fill.position.set(-4, 2.5, 2);
        const rim = new THREE.DirectionalLight('#ffffff', 0.9);
        rim.position.set(-1, 3.5, -5);
        const hemi = new THREE.HemisphereLight('#ffffff', '#2a2a33', 0.7);
        scene.add(key, fill, rim, hemi);
        scene.environment = environment;
        scene.environmentIntensity = 0.8;
      }

      function makeCard(kit, slot, spec, variant) {
        const name = `${slot}_${variant}`;
        const source = kits[kit.file].scene.getObjectByName(name);
        if (!source) return null;
        const group = new THREE.Group();
        const clone = source.clone(true);
        clone.traverse((mesh) => {
          if (!mesh.isMesh) return;
          mesh.userData.row = mesh.material.name;
          mesh.frustumCulled = false;
        });
        group.add(clone);
        const scene = new THREE.Scene();
        studio(scene);
        scene.add(group);
        const box = new THREE.Box3().setFromObject(clone);
        const size = box.getSize(new THREE.Vector3());
        const centre = box.getCenter(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z) * 1.25 + 0.05;
        const camera = new THREE.PerspectiveCamera(34, 4 / 3, 0.05, 60);
        camera.position
          .set(0.8, 0.6, -1)
          .normalize()
          .multiplyScalar(radius * 1.55)
          .add(centre);
        camera.lookAt(centre);
        const article = document.createElement('article');
        article.className = 'card';
        article.dataset.part = name;
        article.innerHTML = `<div class="view"></div><div class="meta"><b>${name}</b><span>${triangleCount(clone).toLocaleString('vi-VN')} tam giác</span><a href="lab.html?part=${name}&spin=0">Mở trong lab</a><span class="tag"></span></div>`;
        return {
          kit: kit.file,
          slot,
          variant,
          name,
          scene,
          camera,
          group,
          pivot: centre,
          element: article,
          view: article.querySelector('.view'),
          tag: article.querySelector('.tag'),
        };
      }

      const cards = [];
      const catalog = $('catalog');
      for (const kit of config.kits) {
        const section = document.createElement('section');
        section.innerHTML = `<h2>${KIT_NAMES[kit.file] ?? kit.file}</h2>`;
        for (const [slot, spec] of Object.entries(kit.slots)) {
          const heading = document.createElement('h3');
          heading.innerHTML = `${SLOT_NAMES[slot] ?? slot} <small>${spec.variants.length} biến thể · tối đa ${spec.maxTriangles.toLocaleString('vi-VN')} tam giác · khung ${spec.size.join(' × ')} m</small>`;
          const grid = document.createElement('div');
          grid.className = 'grid';
          for (const variant of spec.variants) {
            const card = makeCard(kit, slot, spec, variant);
            if (!card) continue;
            cards.push(card);
            grid.append(card.element);
          }
          section.append(heading, grid);
        }
        catalog.append(section);
      }

      function markChosen() {
        const chosen = recipes[state.recipeId].variants;
        for (const card of cards) {
          const used = chosen[card.slot] === card.variant;
          card.element.classList.toggle('chosen', used);
          card.tag.textContent = used ? 'đang dùng trong bộ màu này' : '';
        }
      }

      const recipeSelect = $('recipe');
      for (const id of ids) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = recipes[id].name;
        recipeSelect.append(option);
      }
      recipeSelect.value = state.recipeId;
      recipeSelect.addEventListener('change', () => {
        state.recipeId = recipeSelect.value;
        rebuildMaterials();
        markChosen();
      });
      $('spin').setAttribute('aria-pressed', String(state.spin));
      $('spin').addEventListener('click', (event) => {
        state.spin = !state.spin;
        event.currentTarget.setAttribute('aria-pressed', String(state.spin));
      });
      $('ao').addEventListener('click', (event) => {
        state.ao = !state.ao;
        event.currentTarget.setAttribute('aria-pressed', String(state.ao));
        rebuildMaterials();
      });

      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
      }
      addEventListener('resize', resize);
      resize();
      rebuildMaterials();
      markChosen();

      const background = new THREE.Color('#141418');
      const panel = new THREE.Color('#1b1b21');
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        const height = renderer.domElement.clientHeight;
        renderer.setScissorTest(false);
        renderer.setClearColor(background);
        renderer.clear();
        renderer.setScissorTest(true);
        for (const card of cards) {
          const rect = card.view.getBoundingClientRect();
          if (rect.bottom < 0 || rect.top > height || rect.width === 0) continue;
          if (state.spin) {
            card.group.rotation.y += delta * 0.35;
            swing.copy(card.pivot).applyAxisAngle(UP, card.group.rotation.y);
            card.group.position.copy(card.pivot).sub(swing);
          }
          const bottom = height - rect.bottom;
          renderer.setViewport(rect.left, bottom, rect.width, rect.height);
          renderer.setScissor(rect.left, bottom, rect.width, rect.height);
          renderer.setClearColor(panel);
          renderer.clear();
          card.camera.aspect = rect.width / rect.height;
          card.camera.updateProjectionMatrix();
          renderer.render(card.scene, card.camera);
        }
      });
    </script>
  </body>
</html>
