name: netverse3d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${REDIS_PORT:-56379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:${KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - 127.0.0.1:${KAFKA_PORT:-59092}:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s

  object-store:
    image: chrislusf/seaweedfs:4.53
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -master.volumeSizeLimitMB=64
      - -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-netverse-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me-local-only}
    ports:
      - 127.0.0.1:${S3_PORT:-58333}:8333
    volumes:
      - object-store-data:/data

  mailbox:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - 127.0.0.1:${MAILBOX_SMTP_PORT:-51025}:1025
      - 127.0.0.1:${MAILBOX_HTTP_PORT:-58025}:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-migrate:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    command: [node_modules/.bin/prisma, migrate, deploy]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/identity
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    env_file:
      - ../../services/identity/.env.example
    environment:
      NODE_ENV: ${APP_ENV:-development}
      LOG_PRETTY: 'false'
      SERVICE_NAME: identity
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/identity
      AUTH_JWKS_URL: http://127.0.0.1:3000/.well-known/jwks.json
      AUTH_ISSUER: http://identity:3000
      AUTH_AUDIENCE: identity
      KAFKA_BROKERS: kafka:19092
      TOKEN_AUDIENCES: media,notification
      KEY_ENCRYPTION_SECRET: ${IDENTITY_KEY_ENCRYPTION_SECRET:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      OTP_HASH_SECRET: ${IDENTITY_OTP_HASH_SECRET:-local-development-otp-hash-secret-value}
      OTP_DELIVERY: notification
      OTP_NOTIFICATION_ADDRESS: notification:50051
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.test}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin-password}
    ports:
      - 127.0.0.1:${IDENTITY_PORT:-53002}:3000
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/healthz || exit 1]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  media-migrate:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: services/media/Dockerfile
    command: [node_modules/.bin/prisma, migrate, deploy]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/media
    depends_on:
      postgres:
        condition: service_healthy

  media:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: services/media/Dockerfile
    env_file:
      - ../../services/media/.env.example
    environment:
      NODE_ENV: ${APP_ENV:-development}
      LOG_PRETTY: 'false'
      SERVICE_NAME: media
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/media
      S3_ENDPOINT: object-store
      S3_PORT: 8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-netverse-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-local-only}
      S3_PUBLIC_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-localhost}
      S3_PUBLIC_PORT: ${MEDIA_S3_PUBLIC_PORT:-58333}
      AUTH_JWKS_URL: ${MEDIA_AUTH_JWKS_URL:-http://identity:3000/.well-known/jwks.json}
      AUTH_ISSUER: ${MEDIA_AUTH_ISSUER:-http://identity:3000}
      AUTH_AUDIENCE: media
      KAFKA_BROKERS: kafka:19092
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${MEDIA_PORT:-53001}:3000
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/healthz || exit 1]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      media-migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_started
      identity:
        condition: service_healthy

  notification-migrate:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    command: [node_modules/.bin/prisma, migrate, deploy]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/notification
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    env_file:
      - ../../services/notification/.env.example
    environment:
      NODE_ENV: ${APP_ENV:-development}
      LOG_PRETTY: 'false'
      SERVICE_NAME: notification
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/notification
      AUTH_JWKS_URL: http://identity:3000/.well-known/jwks.json
      AUTH_ISSUER: http://identity:3000
      AUTH_AUDIENCE: notification
      KAFKA_BROKERS: kafka:19092
      GRPC_PORT: 50051
      EMAIL_PROVIDER: smtp
      EMAIL_FROM_ADDRESS: no-reply@netverse.test
      EMAIL_FROM_NAME: Netverse
      SMTP_HOST: mailbox
      SMTP_PORT: 1025
      PUSH_PROVIDER: log
    ports:
      - 127.0.0.1:${NOTIFICATION_PORT:-53003}:3000
      - 127.0.0.1:${NOTIFICATION_GRPC_PORT:-53103}:50051
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:3000/healthz || exit 1]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      mailbox:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    profiles: [observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:${OTEL_GRPC_PORT:-54317}:4317
      - 127.0.0.1:${OTEL_HTTP_PORT:-54318}:4318
      - 127.0.0.1:${OTEL_HEALTH_PORT:-53133}:13133
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-59090}:9090

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    command: [-config.file=/etc/loki/local-config.yaml]
    ports:
      - 127.0.0.1:${LOKI_PORT:-53100}:3100
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-53000}:3000
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  object-store-data:
  prometheus-data:
  loki-data:
  grafana-data:
