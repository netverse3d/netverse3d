name: netverse3d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${REDIS_PORT:-56379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - 127.0.0.1:${KAFKA_PORT:-59092}:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s

  object-store:
    image: chrislusf/seaweedfs:4.53
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -master.volumeSizeLimitMB=64
      - -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
    ports:
      - 127.0.0.1:${S3_PORT:-58333}:8333
    volumes:
      - object-store-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    profiles: [observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:${OTEL_GRPC_PORT:-54317}:4317
      - 127.0.0.1:${OTEL_HTTP_PORT:-54318}:4318
      - 127.0.0.1:${OTEL_HEALTH_PORT:-53133}:13133
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-59090}:9090

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    command: [-config.file=/etc/loki/local-config.yaml]
    ports:
      - 127.0.0.1:${LOKI_PORT:-53100}:3100
    volumes:
      - loki-data:/loki

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-53000}:3000
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  object-store-data:
  prometheus-data:
  loki-data:
  grafana-data:
