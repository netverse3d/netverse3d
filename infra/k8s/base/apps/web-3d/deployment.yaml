apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-3d
  labels:
    app.kubernetes.io/name: web-3d
    app.kubernetes.io/part-of: netverse
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web-3d
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-3d
        app.kubernetes.io/part-of: netverse
    spec:
      containers:
        - name: web
          image: netverse/web-3d:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
