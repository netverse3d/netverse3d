apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-store
  labels:
    app.kubernetes.io/name: object-store
spec:
  serviceName: object-store
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: object-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.53
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -master.volumeSizeLimitMB=64
            - -volume.max=0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-store
                  key: accessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store
                  key: secretKey
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
  labels:
    app.kubernetes.io/name: object-store
spec:
  selector:
    app.kubernetes.io/name: object-store
  ports:
    - name: s3
      port: 8333
      targetPort: s3
