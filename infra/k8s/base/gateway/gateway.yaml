apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: netverse
  namespace: netverse
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: storage
      port: 8333
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
