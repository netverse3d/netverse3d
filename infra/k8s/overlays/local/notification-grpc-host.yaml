apiVersion: v1
kind: Service
metadata:
  name: notification-grpc-host
  namespace: netverse
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      nodePort: 32051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nodeport-grpc
  namespace: netverse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 50051
