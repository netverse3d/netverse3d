apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/data
  - ../../base/apps
  - ../../base/gateway
  - mailbox.yaml
  - notification-grpc-host.yaml
components:
  - ../../components/conformance
patches:
  - path: kafka-external.yaml
    target:
      group: kafka.strimzi.io
      kind: Kafka
      name: netverse-kafka
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: pg-identity
    namespace: netverse-data
    type: kubernetes.io/basic-auth
    literals: [username=identity, password=local-only-identity]
  - name: pg-media
    namespace: netverse-data
    type: kubernetes.io/basic-auth
    literals: [username=media, password=local-only-media]
  - name: pg-notification
    namespace: netverse-data
    type: kubernetes.io/basic-auth
    literals: [username=notification, password=local-only-notification]
  - name: pg-payment
    namespace: netverse-data
    type: kubernetes.io/basic-auth
    literals: [username=payment, password=local-only-payment]
  - name: object-store
    namespace: netverse-data
    literals: [accessKey=netverse-local, secretKey=change-me-local-only]
  - name: identity-secrets
    namespace: netverse
    literals:
      - BOOTSTRAP_ADMIN_EMAIL=admin@example.test
      - BOOTSTRAP_ADMIN_PASSWORD=change-me-admin-password
  - name: media-secrets
    namespace: netverse
    literals:
      - S3_ACCESS_KEY=netverse-local
      - S3_SECRET_KEY=change-me-local-only
  - name: payment-secrets
    namespace: netverse
    literals:
      - PROVIDER_CREDENTIALS_KEYS=
      - PROVIDER_CREDENTIALS_ACTIVE_KEY_VERSION=
