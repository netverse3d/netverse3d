apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-probe
  namespace: netverse
  labels:
    app.kubernetes.io/name: gateway-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-probe
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: [--port, '8080']
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-probe
  namespace: netverse
spec:
  selector:
    app.kubernetes.io/name: gateway-probe
  ports:
    - name: http
      port: 80
      targetPort: http
