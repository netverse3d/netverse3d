apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs
  namespace: netverse
  labels:
    app.kubernetes.io/name: api-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-docs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-docs
          image: netverse/api-docs:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /docs/config.json
              port: http
          livenessProbe:
            httpGet:
              path: /docs/
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-temp
              mountPath: /tmp
      volumes:
        - name: nginx-temp
          emptyDir: {}
