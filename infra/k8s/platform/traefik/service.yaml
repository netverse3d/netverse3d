apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: netverse-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: storage
      port: 8333
      targetPort: storage
    - name: websecure
      port: 443
      targetPort: websecure
