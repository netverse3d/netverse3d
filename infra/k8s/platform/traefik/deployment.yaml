apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: netverse-system
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.17
          args:
            - --configFile=/etc/traefik/traefik.yaml
          ports:
            - name: web
              containerPort: 8000
            - name: storage
              containerPort: 8333
            - name: websecure
              containerPort: 8443
            - name: traefik
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: traefik-config
        - name: tmp
          emptyDir: {}
