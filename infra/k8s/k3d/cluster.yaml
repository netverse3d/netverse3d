apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: netverse
servers: 1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: '56443'
agents: 0
image: rancher/k3s:v1.35.9-k3s1
ports:
  - port: 127.0.0.1:58180:80
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:58335:8333
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:59192:32092
    nodeFilters: [server:0]
  - port: 127.0.0.1:59193:32093
    nodeFilters: [server:0]
  - port: 127.0.0.1:53203:32051
    nodeFilters: [server:0]
  - port: 127.0.0.1:58125:32025
    nodeFilters: [server:0]
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
