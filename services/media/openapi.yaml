info:
  title: media-service
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiResponseDto:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
          example: null
        result:
          type: object
          nullable: true
        requestId:
          type: string
          nullable: true
      required:
        - code
        - message
        - result
        - requestId
    PageResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        page:
          type: number
          example: 1
        size:
          type: number
          example: 20
        totalElements:
          type: number
          example: 42
        totalPages:
          type: number
          example: 3
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    AuditLogResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        actorSubject:
          type: string
          nullable: true
        actorRoles:
          type: array
          items:
            type: string
        ip:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        outcome:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        errorCode:
          type: string
          nullable: true
        metadata:
          type: object
      required:
        - id
        - occurredAt
        - requestId
        - tenantId
        - actorSubject
        - actorRoles
        - ip
        - action
        - resourceType
        - resourceId
        - outcome
        - errorCode
        - metadata
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
      required:
        - status
        - version
    UploadUrlResponseDto:
      type: object
      properties:
        mediaId:
          type: string
          format: uuid
        lifecycle:
          type: string
          enum:
            - TEMPORARY
            - PERMANENT
        uploadUrl:
          type: string
        method:
          type: string
          example: PUT
        uploadUrlExpiresAt:
          type: string
          format: date-time
        mediaExpiresAt:
          type: string
          format: date-time
          nullable: true
        requiredHeaders:
          type: object
          example:
            Content-Type: image/png
      required:
        - mediaId
        - lifecycle
        - uploadUrl
        - method
        - uploadUrlExpiresAt
        - mediaExpiresAt
        - requiredHeaders
    IssueUploadUrlDto:
      type: object
      properties:
        mediaClass:
          type: string
          enum:
            - SYSTEM_ASSET
            - USER_CONTENT
          default: USER_CONTENT
        contentType:
          type: string
          example: image/png
        declaredSizeBytes:
          type: number
          minimum: 0
        originalFilename:
          type: string
          maxLength: 255
        visibility:
          type: string
          enum:
            - PRIVATE
            - INTERNAL
            - PUBLIC
          default: PRIVATE
        ownerType:
          type: string
          description: Required for permanent uploads
          maxLength: 64
        ownerId:
          type: string
          description: Required for permanent uploads
          maxLength: 255
        retentionUntil:
          type: string
          format: date-time
        temporary:
          type: boolean
          default: false
        ttlHours:
          type: number
          minimum: 1
          maximum: 720
          default: 24
        metadata:
          type: object
      required:
        - contentType
        - declaredSizeBytes
    MediaResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mediaClass:
          type: string
          enum:
            - SYSTEM_ASSET
            - USER_CONTENT
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - DELETED
        visibility:
          type: string
          enum:
            - PRIVATE
            - INTERNAL
            - PUBLIC
        lifecycle:
          type: string
          enum:
            - TEMPORARY
            - PERMANENT
        moderationStatus:
          type: string
          enum:
            - NOT_REQUIRED
            - PENDING
            - APPROVED
            - REJECTED
        ownerType:
          type: string
          nullable: true
        ownerId:
          type: string
          nullable: true
        contentType:
          type: string
        declaredSizeBytes:
          type: number
        actualSizeBytes:
          type: number
          nullable: true
        originalFilename:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        retentionUntil:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
      required:
        - id
        - mediaClass
        - status
        - visibility
        - lifecycle
        - moderationStatus
        - ownerType
        - ownerId
        - contentType
        - declaredSizeBytes
        - actualSizeBytes
        - originalFilename
        - createdBy
        - createdAt
        - completedAt
        - expiresAt
        - retentionUntil
        - metadata
    PromoteBatchFailureDto:
      type: object
      properties:
        mediaId:
          type: string
          format: uuid
        errorCode:
          type: string
          example: MEDIA.NOT_FOUND
        message:
          type: string
      required:
        - mediaId
        - errorCode
        - message
    PromoteBatchResponseDto:
      type: object
      properties:
        succeeded:
          type: array
          items:
            $ref: '#/components/schemas/MediaResponseDto'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/PromoteBatchFailureDto'
      required:
        - succeeded
        - failed
    PromoteBatchItemDto:
      type: object
      properties:
        ownerType:
          type: string
          maxLength: 64
        ownerId:
          type: string
          maxLength: 255
        visibility:
          type: string
          enum:
            - PRIVATE
            - INTERNAL
            - PUBLIC
        retentionUntil:
          type: string
          format: date-time
        metadataMerge:
          type: object
        mediaId:
          type: string
          format: uuid
      required:
        - ownerType
        - ownerId
        - mediaId
    PromoteBatchDto:
      type: object
      properties:
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: '#/components/schemas/PromoteBatchItemDto'
      required:
        - items
    DownloadUrlResponseDto:
      type: object
      properties:
        downloadUrl:
          type: string
        method:
          type: string
          example: GET
        expiresAt:
          type: string
          format: date-time
      required:
        - downloadUrl
        - method
        - expiresAt
    IssueDownloadUrlDto:
      type: object
      properties:
        ttlSeconds:
          type: number
          minimum: 60
          maximum: 3600
        contentDisposition:
          type: string
          example: inline; filename="photo.jpg"
          maxLength: 255
    PromoteMediaDto:
      type: object
      properties:
        ownerType:
          type: string
          maxLength: 64
        ownerId:
          type: string
          maxLength: 255
        visibility:
          type: string
          enum:
            - PRIVATE
            - INTERNAL
            - PUBLIC
        retentionUntil:
          type: string
          format: date-time
        metadataMerge:
          type: object
      required:
        - ownerType
        - ownerId
    ModerateMediaDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
        reason:
          type: string
          maxLength: 500
      required:
        - decision
    ApiErrorResponseDto:
      type: object
      properties:
        code:
          type: string
          example: COMMON.VALIDATION
        message:
          type: string
          example: Request validation failed
        details:
          type: object
          nullable: true
        path:
          type: string
          example: /v1/examples
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
      required:
        - code
        - message
        - path
        - timestamp
        - requestId
