                        $ref: '#/components/schemas/PaymentIntentResponseDto'
        '400':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '401':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '403':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '429':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '500':
          description: Standard error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - tenant-api-key: []
      summary: Query the provider now for open attempts (rate limited per attempt) and return the intent
      tags:
        - Payments
info:
  title: payment-gateway-service
  description: ''
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    tenant-api-key:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ApiResponseDto:
      type: object
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
          example: null
        result:
          type: object
          nullable: true
        requestId:
          type: string
          nullable: true
      required:
        - code
        - message
        - result
        - requestId
    PageResponseDto:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        page:
          type: number
          example: 1
        size:
          type: number
          example: 20
        totalElements:
          type: number
          example: 42
        totalPages:
          type: number
          example: 3
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
    AuditLogResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        actorSubject:
          type: string
          nullable: true
        actorRoles:
          type: array
          items:
            type: string
        ip:
          type: string
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        outcome:
          type: string
          enum:
            - SUCCESS
            - FAILURE
        errorCode:
          type: string
          nullable: true
        metadata:
          type: object
      required:
        - id
        - occurredAt
        - requestId
        - tenantId
        - actorSubject
        - actorRoles
        - ip
        - action
        - resourceType
        - resourceId
        - outcome
        - errorCode
        - metadata
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0
      required:
        - status
        - version
    TenantResponseDto:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
            - archived
        default_currency:
          type: string
          example: VND
        metadata_json:
          type: object
          nullable: true
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - code
        - name
        - status
        - default_currency
        - created_at
        - updated_at
    CreateTenantDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        defaultCurrency:
          type: string
          default: VND
        metadata:
          type: object
          additionalProperties: true
      required:
        - code
        - name
    UpdateTenantDto:
      type: object
